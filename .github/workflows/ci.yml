name: Tests and Docker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guestpass_test
          POSTGRES_USER: guestpass
          POSTGRES_PASSWORD: ci_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guestpass -d guestpass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://guestpass:ci_test_password@localhost:5432/guestpass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check app tests scripts
      - run: pytest -q
      - run: node --check app/static/app.js
      - run: cp .env.example .env && docker compose -f compose.yaml config -q
      - run: docker build -t guestpass-ci .
